[project]
name = "foresight-ai"
version = "0.1.0"
description = "Foresight AI: digital-twin failure prediction, counterfactual future branching, and verified Meta-model agent recommendations for a simulated industrial motor."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "joblib>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/foresight/src/foresight", "services/api/foresight_api"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/foresight/src", "services/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: requires MODEL_API_KEY and network access to the Meta Model API",
    "slow: trains models or runs full evaluation",
]
addopts = "-m 'not live'"
